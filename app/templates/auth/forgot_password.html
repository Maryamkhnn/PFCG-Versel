<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | PFCG AI</title>

    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/auth/forgot_password.css') }}">

</head>

<body>

<div class="forgot-container">

    <div class="forgot-card">

        <div class="icon-box">
            🔐
        </div>

        <h1>Forgot Password?</h1>

        <p>
            Enter your registered email address and we will
            send you a password reset code.
        </p>

        {% if error %}
        <div class="error-box">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">

            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required>

            <button type="submit">
                Send Reset Code
            </button>

        </form>

        <a class="back-link"
           href="{{ url_for('auth.login') }}">
            ← Back to Login
        </a>

    </div>

</div>

</body>

</html>
