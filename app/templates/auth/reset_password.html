<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | PFCG AI</title>

    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/auth/reset_password.css') }}">

</head>

<body>

<div class="reset-container">

    <div class="reset-card">

        <div class="icon-box">
            🔑
        </div>

        <h1>Reset Password</h1>

        <p>
            Enter the 6-digit code sent to:
        </p>

        <strong>{{ email }}</strong>

        {% if error %}
        <div class="error-box">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">

            <label>Reset Code</label>

            <input
                type="text"
                name="reset_code"
                placeholder="Enter 6-digit code"
                maxlength="6"
                inputmode="numeric"
                required>

            <label>New Password</label>

            <input
                type="password"
                name="new_password"
                placeholder="Enter new password"
                required>

            <label>Confirm Password</label>

            <input
                type="password"
                name="confirm_password"
                placeholder="Confirm new password"
                required>

            <button type="submit">
                Reset Password
            </button>

        </form>

        <a href="{{ url_for('auth.login') }}">
            ← Back to Login
        </a>

    </div>

</div>

</body>

</html>
